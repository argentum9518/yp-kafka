    environment:
      KAFKA_NODE_ID: 103
      CLUSTER_ID: 'xtzWWN4bTjitpL3kfd9s5g'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '101@localhost:19093,102@localhost:29093,103@localhost:39093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_JMX_PORT: 9993
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:39092,PLAINTEXT_HOST://localhost:39095'
      KAFKA_LISTENERS: 'PLAINTEXT://localhost:39092,PLAINTEXT_HOST://0.0.0.0:39095,CONTROLLER://localhost:39093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
