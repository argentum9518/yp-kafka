version: "3.9"
services:
  kafka101:
    image: "confluentinc/cp-kafka:7.4.0"
    restart: always
    ports:
      - "19092:9092"
      - "9991:9991"
    container_name: kafka101
    environment:
      KAFKA_NODE_ID: 101
      CLUSTER_ID: 'xtzWWN4bTjitpL3kfd9s5g'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '101@localhost:19093,102@localhost:29093,103@localhost:39093'
      KAFKA_PROCESS_ROLES: 'broker,controller' 
      KAFKA_JMX_PORT: 9991
      KAFKA_ADVERTISED_LISTENERS: 'SSL://localhost:19092'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorized
      KAFKA_LISTENERS: 'SSL://localhost:19092,CONTROLLER://localhost:19093'
      KAFKA_LISTENERS_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENERS_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >
      org.apache.kafka.common.security.plain.PlainLoginModule required
      username="admin"
      password="{ADMIN_PASS_PLAIN}";
      KAFKA_LISTENERS_NAME_SSL_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENERS_NAME_SSL_SCRAM-SHA-512_SASL_JAAS_CONFIG: >
      org.apache.kafka.common.security.scram.ScramLoginModule required
      username="admin"
      password="{ADMIN_PASS_SCRAM}";
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,SSL:SASL_SSL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_SASL_ENABLED_MECHANISMS: 'PLAIN,SCRAM-SHA-512'
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka101.keystore.pkcs12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASS}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka101.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_SUPER_USERS: admin
      CONFLUENT_METRICS_ENABLE: 'false'
    network_mode: host
    volumes:
      ./certs/buffer:/etc/kafka/secrets

