services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: >
        -Djava.security.auth.login.config=/etc/kafka/secrets/zoo_jaas.conf
        -Dzookeeper.authProvider.1=org.apache.zookeeper.server.auth.SASLAuthenticationProvider
        -DrequireClientAuthScheme=sasl
    volumes:
      - ./certs:/etc/kafka/secrets

  broker-1:
    hostname: broker-1
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker-1
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "19092:19092"
      - "19093:19093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,SASL_SSL://0.0.0.0:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:19092,SASL_SSL://broker-1:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker-1-keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_SSL_KEYSTORE_FILENAME: broker-1-keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: broker-1.pwd
      KAFKA_SSL_KEY_CREDENTIALS: broker-1.pwd
      KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/broker-1-truststore.jks
      KAFKA_SSL_TRUSTSTORE_FILENAME: broker-1-truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: broker-1.pwd
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_jaas.conf"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:admin"
    volumes:
      - ./certs:/etc/kafka/secrets

  broker-2:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker-2
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,SASL_SSL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-2:29092,SASL_SSL://broker-2:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker-2-keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_SSL_KEYSTORE_FILENAME: broker-2-keystore.jks
      KAFKA_SSL_KEY_CREDENTIALS: broker-2.pwd
      KAFKA_SSL_KEYSTORE_CREDENTIALS: broker-2.pwd
      KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/broker-2-truststore.jks
      KAFKA_SSL_TRUSTSTORE_FILENAME: broker-2-truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: broker-2.pwd
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_jaas.conf"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:admin"
    volumes:
      - ./certs:/etc/kafka/secrets

  broker-3:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker-3
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "39092:39092"
      - "39093:39093"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:39092,SASL_SSL://0.0.0.0:39093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-3:39092,SASL_SSL://broker-3:39093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker-3-keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: changeit
      KAFKA_SSL_KEYSTORE_FILENAME: broker-3-keystore.jks
      KAFKA_SSL_KEY_CREDENTIALS: broker-3.pwd
      KAFKA_SSL_KEYSTORE_CREDENTIALS: broker-3.pwd
      KAFKA_SSL_KEY_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/broker-3-truststore.jks
      KAFKA_SSL_TRUSTSTORE_FILENAME: broker-3-truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: broker-3.pwd
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_jaas.conf"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:admin"
    volumes:
      - ./certs:/etc/kafka/secrets